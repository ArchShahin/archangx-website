<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchangX Pipeline</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b2230; --muted:#5d6676; --line:#e2e5ea; --accent:#2457d6;
          --ok:#1d7a4f; --warn:#a86a00; --bad:#b8322a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11151c; --card:#18202b; --fg:#e6eaf0; --muted:#98a2b3;
          --line:#2a3340; --accent:#7aa2ff; --ok:#56c48f; --warn:#e3a43d; --bad:#f07d73; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:20px; }
  h1 { margin:0; font-size:26px; } p.sub { margin:4px 0 0; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  textarea { width:100%; box-sizing:border-box; min-height:90px; font:inherit; padding:10px; border-radius:8px;
             border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button { margin-top:10px; padding:9px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff;
           font:600 14px system-ui; cursor:pointer; } button:focus-visible { outline:3px solid var(--line); }
  .stages { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  .stage { border:1px solid var(--line); border-radius:8px; padding:10px; } .stage b { display:block; }
  .stage span { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; } table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .pill { padding:2px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .done { color:var(--ok); } .failed { color:var(--bad); } .running { color:var(--warn); }
  pre { white-space:pre-wrap; margin:0; font-size:13px; }
  tr.sel td { background:var(--bg); } tr[data-id] { cursor:pointer; }
</style>
</head>
<body>
<main>
  <header><h1>ArchangX Pipeline</h1>
    <p class="sub">Submit text; five services profile, collect, extract, analyse and report on it in turn.</p></header>

  <section class="card">
    <label for="input"><b>New job</b></label>
    <textarea id="input">Space data centers need 3 cooling loops and 2 power buses. Contact ops@archangx.com for the 2027 plan.</textarea>
    <button id="submit">Submit job</button> <span id="msg" class="sub"></span>
  </section>

  <section class="card"><b>Pipeline</b><p class="sub">Jobs waiting at each stage, and its average time on completed jobs.</p>
    <div class="stages" id="stages"></div></section>

  <section class="card"><b>Recent jobs</b>
    <div class="scroll"><table><thead><tr><th>Submitted</th><th>Status</th>
      <th class="num">profiler</th><th class="num">collector</th><th class="num">extractor</th>
      <th class="num">insights</th><th class="num">reporter</th></tr></thead><tbody id="jobs"></tbody></table></div>
  </section>

  <section class="card" id="detail" hidden><b>Report</b><pre id="report"></pre></section>
</main>
<script>
const STAGES = ["profiler","collector","extractor","insights","reporter"];
const WAITS = {profiler:"queued", collector:"profiled", extractor:"collected", insights:"extracted", reporter:"analyzed"};
let selected = null;
const $ = id => document.getElementById(id);
const cls = s => s === "done" ? "done" : s === "failed" ? "failed" : "running";

async function refresh() {
  try {
    const [stats, jobs] = await Promise.all([fetch("/api/stats").then(r => r.json()), fetch("/api/jobs?limit=25").then(r => r.json())]);
    $("stages").innerHTML = STAGES.map(s => {
      const avg = stats.avg_stage_seconds_last_200_done[s];
      return `<div class="stage"><b>${s}</b><span>${stats.counts[WAITS[s]] || 0} waiting · ${avg == null ? "–" : avg.toFixed(2) + " s"}</span></div>`;
    }).join("");
    $("jobs").innerHTML = jobs.map(j => `<tr data-id="${j.id}" class="${j.id === selected ? "sel" : ""}">
      <td>${new Date(j.created_at).toLocaleTimeString()}</td>
      <td><span class="pill ${cls(j.status)}">${j.status}</span></td>
      ${STAGES.map(s => `<td class="num">${j.timings[s] == null ? "" : j.timings[s].toFixed(2)}</td>`).join("")}</tr>`).join("");
    if (selected) showReport(jobs.find(j => j.id === selected));
  } catch (e) { $("msg").textContent = "Cannot reach the API: " + e.message; }
}

function showReport(job) {
  if (!job) return;
  $("detail").hidden = false;
  $("report").textContent = job.status === "done" ? job.results.reporter.summary
    : job.status === "failed" ? "Failed: " + job.error : `In progress (${job.status})…`;
}

$("jobs").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  selected = tr.dataset.id; refresh();
});

$("submit").addEventListener("click", async () => {
  const input = $("input").value.trim();
  if (!input) { $("msg").textContent = "Enter some text first."; return; }
  const r = await fetch("/api/jobs", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({input})});
  if (!r.ok) { $("msg").textContent = "Submit failed: HTTP " + r.status; return; }
  selected = (await r.json()).id; $("msg").textContent = "Submitted."; refresh();
});

refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
