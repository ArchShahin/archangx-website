# Builds all six images in Google Cloud (no local Docker needed). Run by deploy/gcp.sh.
steps:
  - id: gateway
    name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "SERVICE=gateway", "-t", "${_IMAGE_PREFIX}/gateway:${_TAG}", "."]
    waitFor: ["-"]
  - id: profiler
    name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "SERVICE=profiler", "-t", "${_IMAGE_PREFIX}/profiler:${_TAG}", "."]
    waitFor: ["-"]
  - id: collector
    name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "SERVICE=collector", "-t", "${_IMAGE_PREFIX}/collector:${_TAG}", "."]
    waitFor: ["-"]
  - id: extractor
    name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "SERVICE=extractor", "-t", "${_IMAGE_PREFIX}/extractor:${_TAG}", "."]
    waitFor: ["-"]
  - id: insights
    name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "SERVICE=insights", "-t", "${_IMAGE_PREFIX}/insights:${_TAG}", "."]
    waitFor: ["-"]
  - id: reporter
    name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "SERVICE=reporter", "-t", "${_IMAGE_PREFIX}/reporter:${_TAG}", "."]
    waitFor: ["-"]
images:
  - ${_IMAGE_PREFIX}/gateway:${_TAG}
  - ${_IMAGE_PREFIX}/profiler:${_TAG}
  - ${_IMAGE_PREFIX}/collector:${_TAG}
  - ${_IMAGE_PREFIX}/extractor:${_TAG}
  - ${_IMAGE_PREFIX}/insights:${_TAG}
  - ${_IMAGE_PREFIX}/reporter:${_TAG}
options: { machineType: E2_HIGHCPU_8 }
