# Whole system on one machine:  docker compose up --build   then open http://localhost:8000
x-worker: &worker
  build: { context: ., args: { SERVICE: placeholder } }
  environment:
    DATABASE_URL: postgresql+psycopg://pipeline:pipeline-local@db:5432/pipeline
    WORK_MS: "200"
  depends_on: { db: { condition: service_healthy } }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: pipeline, POSTGRES_PASSWORD: pipeline-local, POSTGRES_DB: pipeline }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pipeline"], interval: 3s, retries: 20 }
  gateway:
    <<: *worker
    build: { context: ., args: { SERVICE: gateway } }
    ports: ["8000:8000"]
  profiler:  { <<: *worker, build: { context: ., args: { SERVICE: profiler } } }
  collector: { <<: *worker, build: { context: ., args: { SERVICE: collector } } }
  extractor: { <<: *worker, build: { context: ., args: { SERVICE: extractor } } }
  insights:  { <<: *worker, build: { context: ., args: { SERVICE: insights } } }
  reporter:  { <<: *worker, build: { context: ., args: { SERVICE: reporter } } }
