# HTTPS on __HOST__ with a Google-managed certificate and a reserved global static IP (pipeline-ip).
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata: { name: pipeline-cert, namespace: pipeline }
spec:
  domains: [__HOST__]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeline
  namespace: pipeline
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: pipeline-ip
    networking.gke.io/managed-certificates: pipeline-cert
spec:
  defaultBackend: { service: { name: gateway, port: { number: 80 } } }
