# Generated shape: one Deployment per service. Image placeholders are filled by deploy/gcp.sh.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: pipeline
  annotations: { cloud.google.com/neg: '{"ingress": true}' }
spec:
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: pipeline, labels: { app: gateway } }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      terminationGracePeriodSeconds: 60   # lets a worker finish its current job on scale-down
      containers:
        - name: gateway
          image: __IMAGE_PREFIX__/gateway:__TAG__
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pipeline-db, key: password } }
            - { name: DATABASE_URL, value: "postgresql+psycopg://pipeline:$(DB_PASSWORD)@postgres:5432/pipeline" }
            - { name: WORK_MS, value: "200" }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: 250m, memory: 256Mi } }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 20, failureThreshold: 3 }
---
